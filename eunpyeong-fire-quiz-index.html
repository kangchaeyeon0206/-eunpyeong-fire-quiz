<style>

 else{if(selected===null){alert("보기를 하나 선택해주세요.");return}ok=selected}
 if(ok)score++;results.push(ok);idx++;
 if(idx<quiz.length)render();else finish();
}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 $("score").textContent=`${score} / ${quiz.length}`;
 $("msg").textContent=score===10?"🎉 모두 정답입니다!":score>=8?"👏 아주 잘했어요!":"교육 내용을 다시 확인해 주세요.";
 $("details").innerHTML=quiz.map((x,i)=>`<div class="detail"><b>${i+1}. ${esc(x.q)}</b><div class="${results[i]?"good":"bad"}">${results[i]?"정답":"오답"}</div></div>`).join("");
}
</script>
</body>
</html>
