<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>은평관 소방교육 퀴즈</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 6px 24px rgba(0,0,0,.07);margin-top:14px}.badge{display:inline-block;background:#fff1f0;color:#d92d20;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}h1{font-size:26px;margin:12px 0 8px}.sub{color:#667085;line-height:1.6}.small{font-size:13px;color:#667085;line-height:1.55}button{font:inherit}.primary{width:100%;border:0;border-radius:15px;padding:16px;background:#e53935;color:#fff;font-size:17px;font-weight:800;margin-top:16px}.primary:disabled{background:#c7cdd4}.field{margin-top:14px}.field label{display:block;font-weight:800;margin-bottom:8px}select,input{width:100%;padding:16px;border:2px solid #e1e6ed;border-radius:15px;font-size:16px;outline:none;background:#fff}select:focus,input:focus{border-color:#e53935}.notice{margin-top:12px;padding:12px;border-radius:12px;background:#f8fafc;color:#475467;font-size:13px;line-height:1.5}.qnum{font-size:14px;font-weight:800;color:#d92d20}.progress{height:8px;background:#e9edf2;border-radius:99px;overflow:hidden;margin:13px 0 18px}.bar{height:100%;width:0;background:#e53935;transition:.2s}.q{font-size:20px;font-weight:800;line-height:1.5;margin-bottom:18px}.opt{display:block;width:100%;text-align:left;border:2px solid #e1e6ed;background:#fff;border-radius:15px;padding:15px 13px;margin:10px 0;line-height:1.5;font-size:16px}.opt.selected{border-color:#e53935;background:#fff7f6}.n{font-weight:900;margin-right:8px}.essayhelp{font-size:13px;color:#667085;line-height:1.5;margin:8px 0 12px}.hidden{display:none}.score{text-align:center;font-size:44px;font-weight:900;margin:12px}.msg{text-align:center;font-weight:800}.detail{border-top:1px solid #edf0f3;padding:14px 0}.good{color:#087443;font-weight:800}.bad{color:#b42318;font-weight:800}.answerline{margin-top:7px;line-height:1.55}.explain{margin-top:9px;padding:10px 12px;background:#f8fafc;border-radius:12px;line-height:1.55;color:#475467}.datehint{font-size:12px;color:#667085;margin-top:6px}</style></head><body><div class="wrap"><section class="card" id="start"><span class="badge">🚒 은평관 소방교육</span><h1>소방교육 퀴즈</h1><p class="sub">총 62문항 중 10문제가 랜덤으로 출제됩니다.<br>보기 순서와 정답 번호도 매번 랜덤으로 변경됩니다.</p><div class="field"><label>이름</label><select id="name"><option value="">이름을 선택해주세요</option><option>최성진</option><option>김태영</option><option>신희정</option><option>류시현</option><option>최진호</option><option>신미령</option><option>송동현</option><option>정채린</option><option>이창호</option><option>이지민</option><option>조민성</option><option>유동건</option></select></div><div class="field"><label>근무일</label><select id="date"><option value="2026-08-20">8월 20일(목)</option><option value="2026-08-21" selected>8월 21일(금)</option><option value="2026-08-22">8월 22일(토)</option><option value="2026-08-23">8월 23일(일)</option><option value="2026-08-24">8월 24일(월)</option><option value="2026-08-25">8월 25일(화)</option><option value="2026-08-26">8월 26일(수)</option></select><div class="datehint">근무표 기준으로 해당 날짜의 지정위치가 자동 적용됩니다.</div></div><div id="startNotice" class="notice">이름과 근무일을 선택해주세요.</div><button class="primary" id="startBtn" onclick="startQuiz()" disabled>퀴즈 시작하기</button></section><section class="card hidden" id="quiz"><div class="qnum" id="qnum"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="q" id="question"></div><div id="answers"></div><button class="primary" id="next" onclick="nextQ()" disabled>답변을 선택해주세요</button></section><section class="card hidden" id="result"><span class="badge">결과</span><div class="score" id="score"></div><p class="msg" id="msg"></p><div id="details"></div><button class="primary" onclick="location.reload()">다시 풀기</button></section></div><script>const QUESTIONS=[{"cat":"지정위치","kind":"location","q":"오늘 본인의 지정위치를 입력해주세요."},{"cat":"모닝시그널","kind":"mc","q":"모닝시그널 훈련에서 확인하는 소방시설 3가지는 무엇인가?","opts":["소화기, 소화전, 비상구","경광봉, 랜턴, 확성기","방화문, 스프링클러, 감지기","전기차단기, 승강기, 계단"],"ans":0,"why":"모닝시그널은 근무 위치에서 가까운 소화기·소화전·비상구 위치를 확인하는 훈련입니다."},{"cat":"모닝시그널","kind":"mc","q":"모닝시그널 훈련의 목적은 무엇인가?","opts":["내가 근무하는 곳에서 가장 가까운 소화기·소화전·비상구 위치를 확인하기 위해","내가 근무하는 곳에서 가장 가까운 고객 동선·청소구역·근무구역을 확인하기 위해","내가 근무하는 곳에서 가장 가까운 전기시설·승강기·계단 위치를 확인하기 위해","내가 근무하는 곳에서 가장 가까운 상품·매점·화장실 위치를 확인하기 위해"],"ans":0,"why":"비상 상황에서 가까운 소방시설을 신속하게 찾을 수 있도록 위치를 직접 숙지하는 것이 목적입니다."},{"cat":"모닝시그널","kind":"mc","q":"매점에서 가장 가까운 소화기의 위치는 어디인가?","opts":["인포 쪽","사무실 비상계단 앞","2관 퇴출로","7층 베이비시트 앞"],"ans":0,"why":"우리 관 현장 기준으로 매점에서 가장 가까운 소화기는 인포 쪽입니다."},{"cat":"모닝시그널","kind":"mc","q":"매점에서 가장 가까운 소화전의 위치는 어디인가?","opts":["인포 쪽","사무실 비상계단 앞","게임파크 앞","8관 입장로"],"ans":1,"why":"우리 관 현장 기준으로 매점에서 가장 가까운 소화전은 사무실 비상계단 앞입니다."},{"cat":"모닝시그널","kind":"mc","q":"매점에서 가장 가까운 비상구는 어디인가?","opts":["인포 쪽","2관 퇴출로","사무실 비상계단","7층 8관 입장로"],"ans":2,"why":"우리 관 현장 기준으로 매점에서 가장 가까운 비상구는 사무실 비상계단입니다."},{"cat":"모닝시그널","kind":"mc","q":"모닝시그널 훈련에서 관리자가 소방시설물을 선창하고 드리미는 어떻게 해야 하는가?","opts":["관리자가 말한 소방시설물을 3회 복창한다.","관리자가 말한 소방시설물을 1회 복창한다.","관리자가 말한 소방시설물을 3회 확인한 후 복창하지 않는다.","관리자가 말한 소방시설물을 확인한 후 관리자가 다시 말할 때까지 대기한다."],"ans":0,"why":"관리자가 선창한 소방시설물을 드리미가 3회 복창하는 것이 현장 훈련 기준입니다."},{"cat":"모닝시그널","kind":"mc","q":"모닝시그널 훈련은 어떤 방식으로 진행하는가?","opts":["소방시설 위치를 가리키며 관리자가 선창하고 드리미가 복창하는 과정을 3회 반복한다.","소방시설 위치를 가리키며 드리미가 선창하고 관리자가 복창하는 과정을 3회 반복한다.","소방시설 위치를 가리키며 관리자가 한 번 선창하고 드리미가 한 번 복창한다.","소방시설 위치를 확인한 후 구두교육만 실시하고 복창 과정은 진행하지 않는다."],"ans":0,"why":"관리자 선창 → 드리미 복창을 3회 반복하며 위치와 명칭을 함께 숙지합니다."},{"cat":"모닝시그널","kind":"mc","q":"모닝시그널 훈련에서 소방시설의 위치를 직접 확인하는 이유는 무엇인가?","opts":["비상 상황에서 가까운 소방시설을 신속 "cat":"대피행동요령 세부","kind":"mc","q":"잔여인원을 확인해야 하는 장소는 어디인가?","opts":["상영관·홀·화장실","매점·사무실","옥상만","외부 집결지만"],"ans":0,"why":"잔여인원 확인은 상영관·홀·화장실 등 고객이 남아 있을 수 있는 장소를 확인하는 과정입니다."},{"cat":"대피행동요령 세부","kind":"mc","q":"잔여인원 확인 중 부상자를 발견했을 때 이동시키는 안전한 장소는?","opts":["옥외피난계단(2관 퇴출로)","매점","사무실","상영관"],"ans":0,"why":"부상자는 관리자에게 무전한 후 안전한 장소인 옥외피난계단(2관 퇴출로)으로 이동합니다."},{"cat":"피난방향","kind":"mc","q":"옥상층으로 피난할 수 있는 조건 2가지는 무엇인가?","opts":["옥상층 비상구가 상시 개방되어 있고, 영화관 사용층과 옥상층이 1개층 이내인 경우","옥상층 비상구가 잠겨 있고 영화관 사용층과 옥상층이 2개층 이내인 경우","소화전이 설치되어 있고 영화관 사용층과 옥상층이 2개층 이내인 경우","옥상층 비상구가 상시 개방되어 있고 영화관 사용층과 옥상층이 2개층 이상 떨어진 경우"],"ans":0,"why":"옥상층 피난 조건은 옥상층 비상구 상시 개방과 사용층-옥상층 1개층 이내라는 두 조건입니다."},{"cat":"피난방향","kind":"mc","q":"옥상층 대피 조건에 해당하지 않는 것은?","opts":["옥상층 비상구가 상시 개방되어 있다.","영화관 사용층과 옥상층이 1개층 이내다.","옥상층에 소화전이 설치되어 있다.","위 ①, ② 조건을 모두 충족한다."],"ans":2,"why":"옥상층 대피 조건은 비상구 개방 여부와 층수 관계이며 소화전 설치 여부는 조건이 아닙니다."},{"cat":"피난방향","kind":"mc","q":"옥상층으로 대피해야 하는 상황은?","opts":["옥상층 비상구가 상시 개방되어 있고 사용층과 옥상층이 1개층 이내이며, 영화관 하부층 피난계단으로 대피하기 어려운 경우","모든 화재 상황에서 옥상층 비상구가 개방되어 있으면 옥상으로 이동하는 경우","옥상 비상구가 잠겨 있어도 다른 계단으로 이동하기 어려우면 옥상으로 이동하는 경우","사용층과 옥상층이 2개층 이상 떨어져 있어도 옥상으로 이동하는 경우"],"ans":0,"why":"하부층 피난계단으로 대피하기 어렵고 옥상 비상구가 상시 개방되어 있으며 1개층 이내인 경우 옥상 대피를 고려합니다."},{"cat":"피난방향","kind":"mc","q":"영화관 사용층과 옥상층이 2개층 이상 떨어져 있다면 옥상층 대피 조건에 해당하는가?","opts":["해당하지 않는다.","해당한다.","비상구가 열리면 해당한다.","화재 규모에 따라 무조건 해당한다."],"ans":0,"why":"사용층과 옥상층이 2개층 이상이면 정해진 옥상층 대피 조건을 충족하지 않습니다."},{"cat":"피난방향","kind":"mc","q":"시네마층이 아닌 다른 층에서 화재가 발생한 경우 대피 전에 무엇을 확인해야 하는가?","opts":["비상구를 미리 확인한다.","바로 옥상으로 이동한다.","비상구를 확인하지 않고 지정위치로 이동한다.","대피를 중단하고 사무실로 복귀한다."],"ans":0,"why":"시네마층 외 화재에서는 대피 전에 사용할 비상구를 미리 확인합니다."},{"cat":"피난방향","kind":"mc","q":"비상구 문은 어떻게 확인해야 하는가?","opts":["손등으로 문을 확인한 후, 뜨겁지 않으면 문을 열어 아래 상황을 확인한다.","손바닥으로 문을 확인한 후, 뜨겁지 않으면 문을 바로 열어 대피한다.","발로 문을 확인한 후, 뜨겁지 않으면 문을 바로 열어 아래로 이동한다.","문을 확인하지 않고 바로 열어 계단 상황을 확인한다."],"ans":0,"why":"비상구 문은 손등으로 온도를 확인하고 뜨겁지 않을 때 문을 열어 아래 상황을 확인합니다."},{"cat":"피난방향","kind":"mc","q":"비상구 문 tem.p]=r;rankMap[item.p]=r})});return rankMap}function getRank(d,n){return (buildRanks(SHIFT_SCHEDULE[d]||[])[n])||0}function updateStart(){name=$("name").value;date=$("date").value;rank=getRank(date,name);$("startBtn").disabled=!rank;if(rank)$("startNotice").textContent='선택이 완료되었습니다. 퀴즈를 시작해주세요.';else $("startNotice").textContent=`${name||'이름'}님은 선택한 날짜에 근무 스케줄이 없습니다. 근무일을 다시 선택해주세요.`}$("name").addEventListener('change',updateStart);$("date").addEventListener('change',updateStart);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startQuiz(){if(!rank)return;const cats=['모닝시그널','소화기','소화전','대피행동요령 전체','대피행동요령 세부','피난방향'];quiz=[QUESTIONS.find(x=>x.cat==='지정위치'),QUESTIONS.find(x=>x.cat==='훈련 4대 원칙'),...cats.map(c=>{const a=QUESTIONS.filter(x=>x.cat===c);return a[Math.floor(Math.random()*a.length)]})];const pool=QUESTIONS.filter(x=>!['지정위치','훈련 4대 원칙'].includes(x.cat));while(quiz.length<10){const x=pool[Math.floor(Math.random()*pool.length)];if(!quiz.includes(x))quiz.push(x)}quiz=shuffle([quiz[0],quiz[1],...quiz.slice(2)]);idx=0;results=[];$("start").classList.add('hidden');$("quiz").classList.remove('hidden');renderQ()}function renderQ(){const x=quiz[idx];$("qnum").textContent=`${idx+1} / ${quiz.length}`;$("bar").style.width=((idx)/quiz.length*100)+'%';$("question").textContent=(x.kind==='location'?`${name}님, 오늘 본인의 지정위치를 입력해주세요.`:x.q);const a=$("answers");a.innerHTML='';$("next").disabled=true;$("next").textContent=idx===quiz.length-1?'결과 확인':'다음 문제';if(x.kind==='mc'){shuffle(x.opts.map((t,i)=>({t,i}))).forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="n">${['①','②','③','④'][i]}</span>${o.t}`;b.onclick=()=>chooseMC(b,o.i);a.appendChild(b)})}else if(x.kind==='location'){a.innerHTML='<div class="essayhelp">본인에게 배정된 지정위치를 직접 입력해주세요.</div><input id="essay" autocomplete="off" placeholder="지정위치를 입력해주세요">';$('essay').addEventListener('input',()=>$("next").disabled=!$('essay').value.trim())}else{a.innerHTML='<div class="essayhelp">※ 예시나 정답을 미리 표시하지 않습니다. 4가지 원칙을 직접 입력해주세요.</div><input id="essay" autocomplete="off" placeholder="4대 원칙을 입력해주세요">';$('essay').addEventListener('input',()=>$("next").disabled=!$('essay').value.trim())}}function chooseMC(btn,orig){document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');quiz[idx]._chosen=orig;$("next").disabled=false}function nextQ(){const x=quiz[idx];let chosen=null,correct=false,display='';if(x.kind==='mc'){chosen=x._chosen;correct=chosen===x.ans;display=x.opts[chosen]}else{chosen=$("essay").value.trim();if(x.kind==='location'){correct=locOK(chosen,rank);display=LOCS[rank].join(' / ')}else{correct=principlesOK(chosen);display='웃지 않고 / 큰 소리로 / 신속하고 / 안전하게'}}results.push({x,chosen,correct,display});if(idx<quiz.length-1){idx++;renderQ()}else showResult()}function showResult(){$("quiz").classList.add('hidden');$("result").classList.remove('hidden');const score=results.filter(r=>r.correct).length;$("score").textContent=`${score} / ${results.length}`;$("msg").textContent=score===10?'🎉 모두 정답입니다!':score>=8?'👏 아주 잘했어요!':score>=6?'👍 조금만 더 복습해봐요!':'📚 교육 내용을 한 번 더 확인해봐요!';const d=$("details");d.innerHTML='';results.forEach((r,i)=>{const div=document.createElement('div');div.className='detail';const x=r.x;let your=typeof r.chosen==='number'?x.opts[r.chosen]:r.chosen||'미입력';let ans=x.kind==='mc'?x.opts[x.ans]:r.display;let locExplain='';if(x.kind==='location'){locExplain='<b>📍 지정위치 전체 순위</b><br>'+Object.keys(LOCS).map(k=>k+'순위: '+LOCS[k][0]).join('<br>')}div.innerHTML=`<div><b>${i+1}. ${x.q}</b></div><div class="answerline ${r.correct?'good':'bad'}">${r.correct?'✅ 정답입니다.':'❌ 오답입니다.'}</div><div class="answerline"><b>내 답:</b> ${escapeHtml(your)}</div><div class="answerline"><b>정답:</b> ${escapeHtml(ans)}</div><div class="explain"><b>💡 정답 해설</b><br>${escapeHtml(x.why||'정답 기준에 따라 행동하는 것이 중요합니다.')} ${locExplain?'<br><br>'+locExplain:''}</div>`;d.appendChild(div)})}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
